[project]
name = "visionai"
version = "0.1.0"
description = "AI-powered semantic image search using LLaVA vision models and Ollama embeddings with pgvector"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "uvicorn>=0.40.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "Pillow>=10.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "requests>=2.31",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

